# Server-side net: the same tests and checks as the pre-push hook, run by GitHub on every push and pull request,
# so a push made with --no-verify (or from a clone without the hooks) is still judged.
# Pair it with a branch protection rule that requires this job before merging into main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Checks on the pushed range
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # first push of a branch: judge from where it left main; for main itself (or no main) from the root commit
            base=$(git merge-base HEAD origin/main 2>/dev/null || true)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
              base=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          echo "base: $base"
          python3 -I bin/stopline run "$base"
      - name: Secret scan of every tracked file (covers the root commit, which has no base)
        run: python3 -I bin/stopline tree
